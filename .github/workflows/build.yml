name: Build Nova Standalone + Game Bootstrap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Verify culler signatures against supplied disassembly
        run: python3 tools/verify_signatures.py
      - name: Syntax-check patch tools and unit tests
        run: |
          python3 -m py_compile tools/patch_minecraft.py tools/inspect_minecraft_apk.py tools/verify_signatures.py tools/test_patch_minecraft.py
          python3 tools/test_patch_minecraft.py
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile game-side Application bootstrap into a standalone DEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/game-bootstrap/classes artifacts/game-bootstrap-dex
          android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          d8="$ANDROID_HOME/build-tools/35.0.0/d8"
          test -f "$android_jar"
          test -x "$d8"
          javac -source 8 -target 8 -Xlint:-options \
            -classpath "$android_jar" \
            -d build/game-bootstrap/classes \
            tools/game-bootstrap-src/com/nova/standalone/NovaBootstrapApplication.java
          "$d8" --min-api 29 --lib "$android_jar" \
            --output artifacts/game-bootstrap-dex \
            build/game-bootstrap/classes/com/nova/standalone/NovaBootstrapApplication.class \
            build/game-bootstrap/classes/com/nova/standalone/NativeBootstrap.class
          test -s artifacts/game-bootstrap-dex/classes.dex
          mv artifacts/game-bootstrap-dex/classes.dex artifacts/game-bootstrap-dex/nova-bootstrap.dex
          python3 - <<'PY'
          from pathlib import Path
          data = Path("artifacts/game-bootstrap-dex/nova-bootstrap.dex").read_bytes()
          assert data.startswith(b"dex\n"), "D8 output is not a DEX file"
          for symbol in (b"Lcom/nova/standalone/NovaBootstrapApplication;", b"Lcom/nova/standalone/NativeBootstrap;"):
              assert symbol in data, f"Missing class in bootstrap DEX: {symbol!r}"
          print("PASS: standalone bootstrap DEX contains both required classes")
          PY
      - name: Build debug launcher and native core
        run: gradle --no-daemon :launcher:assembleDebug
      - name: Stage ARM64 native core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-core
          so_path="$(find launcher/build -type f -path '*/lib/arm64-v8a/libnova_core.so' -print -quit)"
          if [[ -z "$so_path" ]]; then
            apk_path="$(find launcher/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
            if [[ -z "$apk_path" ]]; then
              echo "Neither a staged native library nor a debug APK was found" >&2
              find launcher/build -type f -name '*.so' -print || true
              exit 1
            fi
            unzip -p "$apk_path" lib/arm64-v8a/libnova_core.so > artifacts/native-core/libnova_core.so
          else
            cp "$so_path" artifacts/native-core/libnova_core.so
          fi
          test -s artifacts/native-core/libnova_core.so
          file artifacts/native-core/libnova_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: NovaStandalone-debug-apk
          path: launcher/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovaStandalone-native-core-arm64
          path: artifacts/native-core/libnova_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: NovaStandalone-game-bootstrap-dex
          path: artifacts/game-bootstrap-dex/nova-bootstrap.dex
